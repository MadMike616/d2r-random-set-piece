[recipe]
# D2 item codes. Defaults are El and Eld runes; set either value to another
# 3- or 4-character item code to change the recipe. Either field may be "" to
# omit that ingredient; set both to "" for a free reroll.
input_x = "r01"
input_y = "r02"
# Chance that a valid recipe consumes any configured ingredients but keeps the
# original set item. Use an integer from 0 (never) to 100 (always).
failure_chance_percent = 0
# If true, only identified set items can be rerolled. Unidentified items do not
# match the recipe and remain untouched.
require_identified_set_item = false

[tables]
# Blank uses the active mod's loose data/global/excel folder and can copy missing
# tables from d2rloader/plugins/basefiles-and-backups/basefiles/global/excel.
# Set a folder here to read sets.txt and setitems.txt there without auto-copying.
table_directory = ""
